<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI食堂うみべ AI受付（試作）</title>
<style>body{font-family:sans-serif;text-align:center;padding:40px}button{font-size:24px;padding:20px 40px;border-radius:40px}</style>
</head><body>
<h1>📞 AI食堂うみべ AI受付（試作）</h1>
<p>ボタンを押してマイクを許可し、話しかけてください。（イヤホン推奨）</p>
<button id="btn">🎤 話す</button>
<p id="status">待機中</p>
<script>
const btn = document.getElementById('btn'), status = document.getElementById('status');
let ws, micCtx, playCtx, stream, nextTime = 0, sources = [];

// マイク音声を 16kHz・PCM16 に変換して送る AudioWorklet
const workletCode = `
class Mic extends AudioWorkletProcessor {
  process(inputs) {
    const ch = inputs[0][0];
    if (ch) {
      const pcm = new Int16Array(ch.length);
      for (let i = 0; i < ch.length; i++) pcm[i] = Math.max(-1, Math.min(1, ch[i])) * 0x7fff;
      this.port.postMessage(pcm.buffer, [pcm.buffer]);
    }
    return true;
  }
}
registerProcessor('mic', Mic);`;

async function start() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/browser');
  ws.binaryType = 'arraybuffer';
  ws.onmessage = (e) => {
    if (typeof e.data === 'string') {
      if (JSON.parse(e.data).type === 'interrupted') stopPlayback(); // 割り込み：再生を止める
    } else play(e.data);
  };
  ws.onclose = () => stop();
  // 再生用（Geminiは24kHz）と録音用（16kHz）
  playCtx = new AudioContext({ sampleRate: 24000 });
  micCtx = new AudioContext({ sampleRate: 16000 });
  stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  await micCtx.audioWorklet.addModule(URL.createObjectURL(new Blob([workletCode], { type: 'text/javascript' })));
  const node = new AudioWorkletNode(micCtx, 'mic');
  node.port.onmessage = (e) => ws.readyState === 1 && ws.send(e.data);
  micCtx.createMediaStreamSource(stream).connect(node);
  btn.textContent = '⏹ 終了'; status.textContent = '会話中…話しかけてください';
}

// 届いた音声（PCM16 24kHz）を順番に再生する
function play(buf) {
  const pcm = new Int16Array(buf), f = new Float32Array(pcm.length);
  for (let i = 0; i < pcm.length; i++) f[i] = pcm[i] / 0x8000;
  const ab = playCtx.createBuffer(1, f.length, 24000);
  ab.copyToChannel(f, 0);
  const src = playCtx.createBufferSource();
  src.buffer = ab; src.connect(playCtx.destination);
  nextTime = Math.max(nextTime, playCtx.currentTime);
  src.start(nextTime); nextTime += ab.duration;
  sources.push(src); src.onended = () => (sources = sources.filter((s) => s !== src));
}
function stopPlayback() { sources.forEach((s) => s.stop()); sources = []; nextTime = 0; }

function stop() {
  stopPlayback();
  stream?.getTracks().forEach((t) => t.stop());
  micCtx?.close(); playCtx?.close(); if (ws?.readyState === 1) ws.close();
  ws = null; btn.textContent = '🎤 話す'; status.textContent = '終了しました';
}
btn.onclick = () => (ws ? stop() : start().catch((e) => { status.textContent = 'エラー: ' + e.message; stop(); }));
</script>
</body></html>
